name: Imagen del tablón de tareas

# Construye el tablón de tareas (carpeta tareas/) y lo publica en ghcr.io/nerva2026/hotspot-hq-tareas.
# Es una aplicación pequeña de Node sin dependencias: tarda un minuto.

on:
  push:
    branches: [hotspot]
    paths:
      - "tareas/**"
      - ".github/workflows/hotspot-tareas.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/nerva2026/hotspot-hq-tareas

concurrency:
  group: imagen-tareas
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar el código
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for f in tareas/servidor/*.js tareas/publico/app/*.js; do node --check "$f"; done

      - name: Probar el servidor
        working-directory: tareas
        run: |
          mkdir -p /tmp/datos
          TAREAS_DATOS=/tmp/datos TAREAS_PUERTO=3999 node servidor/principal.js > /tmp/tablon.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3999/tareas/salud && break; sleep 0.5; done
          curl -fs http://127.0.0.1:3999/tareas/ | grep -q "Tareas · HOT SPOT S.L."
          grep -q "#alta=" /tmp/tablon.log
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/tareas/api/datos)" = 401
          echo "Servidor del tablón: bien"

      - name: Probar el libro de cuentas
        working-directory: tareas
        run: |
          # Usa el servidor del paso anterior (puerto 3999) y su enlace de alta, que aún no ha usado nadie.
          CODIGO=$(grep -o '#alta=[A-Za-z0-9_-]*' /tmp/tablon.log | head -1 | cut -d= -f2)
          if ! node pruebas/libro.mjs http://127.0.0.1:3999/tareas "$CODIGO" > /tmp/prueba-libro.log 2>&1; then
            cat /tmp/prueba-libro.log /tmp/tablon.log
            tail -n 15 /tmp/prueba-libro.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::libro: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-libro.log

      - name: Probar la pizarra
        working-directory: tareas
        run: |
          # Un servidor aparte (puerto 3997), con su propio enlace de alta.
          mkdir -p /tmp/datos-pizarra
          TAREAS_DATOS=/tmp/datos-pizarra TAREAS_PUERTO=3997 node servidor/principal.js > /tmp/tablon-pizarra.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3997/tareas/salud && break; sleep 0.5; done
          CODIGO=$(grep -o '#alta=[A-Za-z0-9_-]*' /tmp/tablon-pizarra.log | head -1 | cut -d= -f2)
          if ! node pruebas/pizarra.mjs http://127.0.0.1:3997/tareas "$CODIGO" > /tmp/prueba-pizarra.log 2>&1; then
            cat /tmp/prueba-pizarra.log /tmp/tablon-pizarra.log
            tail -n 15 /tmp/prueba-pizarra.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::pizarra: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-pizarra.log

      - name: Probar el acceso de la oficina (openid-client, como WorkAdventure)
        working-directory: tareas
        run: |
          mkdir -p /tmp/oidc && (cd /tmp/oidc && npm init -y >/dev/null && npm install --silent openid-client@5.7.1)
          node pruebas/google-falso.mjs > /tmp/google.log 2>&1 &
          mkdir -p /tmp/datos-oidc
          TAREAS_DATOS=/tmp/datos-oidc TAREAS_PUERTO=3998 TAREAS_URL=http://localhost:3998/tareas/ \
          GOOGLE_CLIENT_ID=cliente-google GOOGLE_CLIENT_SECRET=secreto-google \
          GOOGLE_AUTH_URL=http://localhost:8412/auth GOOGLE_TOKEN_URL=http://localhost:8412/token \
          OIDC_SECRETO=secreto-oficina OIDC_EMISOR=http://127.0.0.1:3998/cuentas OIDC_REDIRECCIONES=http://localhost:9999/openid-callback \
          CREW_ADMIN=admin@example.com node servidor/principal.js > /tmp/tablon-oidc.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3998/tareas/salud && break; sleep 0.5; done
          cp pruebas/oficina-oidc.mjs /tmp/oidc/
          # (el servidor del paso anterior sigue en el 3999; este usa el 3998)
          if ! (cd /tmp/oidc && node oficina-oidc.mjs > /tmp/prueba-oidc.log 2>&1); then
            cat /tmp/prueba-oidc.log /tmp/tablon-oidc.log
            # Los errores también como anotaciones, para poder leerlos sin entrar en GitHub
            tail -n 15 /tmp/prueba-oidc.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::prueba: $linea"; done
            tail -n 10 /tmp/tablon-oidc.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::servidor: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-oidc.log

      - name: Preparar Docker
        uses: docker/setup-buildx-action@v3

      - name: Entrar en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: tareas
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGEN }}:${{ github.run_number }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=HOT SPOT S.L. · tablón de tareas
            org.opencontainers.image.description=Tablón de tareas de la oficina de HOT SPOT S.L.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: false
          sbom: false

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo "- \`${IMAGEN}:${{ github.run_number }}\`"
            echo "- \`${IMAGEN}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
