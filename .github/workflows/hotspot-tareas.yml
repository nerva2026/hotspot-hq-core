name: Imagen del tablón de tareas

# Construye el tablón de tareas (carpeta tareas/) y lo publica en ghcr.io/nerva2026/hotspot-hq-tareas.
# Es una aplicación pequeña de Node sin dependencias: tarda un minuto.

on:
  push:
    branches: [hotspot]
    paths:
      - "tareas/**"
      - ".github/workflows/hotspot-tareas.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/nerva2026/hotspot-hq-tareas

concurrency:
  group: imagen-tareas
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar el código
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for f in tareas/servidor/*.js tareas/publico/app/*.js tareas/portada/*.js tareas/pruebas/*.mjs; do node --check "$f"; done

      # Pruebas: cada paso arranca su propio servidor, con su carpeta de datos, su registro y su puerto (no se repite
      # ninguno), y lo para al acabar. Puertos: servidor 3999 · libro 3991 · pizarra 3997 · tablón 3993 ·
      # cumpleaños 3994 · archivo 3992 · música 3995 (la prueba arranca otro sin Spotify en el 3996 y usa el
      # Spotify de mentira del 8614) · acceso de la oficina 3998 (con el Google de mentira del 8412).
      - name: Probar el servidor
        working-directory: tareas
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT   # al acabar el paso (bien o mal) se para lo que haya arrancado
          mkdir -p /tmp/datos-servidor
          TAREAS_DATOS=/tmp/datos-servidor TAREAS_PUERTO=3999 node servidor/principal.js > /tmp/tablon-servidor.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3999/tareas/salud && break; sleep 0.5; done
          curl -fs http://127.0.0.1:3999/tareas/ | grep -q "Tareas · HOT SPOT S.L."
          grep -q "#alta=" /tmp/tablon-servidor.log
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/tareas/api/datos)" = 401
          echo "Servidor del tablón: bien"

      - name: Probar el libro de cuentas
        working-directory: tareas
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT   # al acabar el paso (bien o mal) se para lo que haya arrancado
          # Un servidor aparte (puerto 3991), con su propio enlace de alta.
          mkdir -p /tmp/datos-libro
          TAREAS_DATOS=/tmp/datos-libro TAREAS_PUERTO=3991 node servidor/principal.js > /tmp/tablon-libro.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3991/tareas/salud && break; sleep 0.5; done
          CODIGO=$(grep -o '#alta=[A-Za-z0-9_-]*' /tmp/tablon-libro.log | head -1 | cut -d= -f2)
          if ! node pruebas/libro.mjs http://127.0.0.1:3991/tareas "$CODIGO" > /tmp/prueba-libro.log 2>&1; then
            cat /tmp/prueba-libro.log /tmp/tablon-libro.log
            tail -n 15 /tmp/prueba-libro.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::libro: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-libro.log

      - name: Probar la pizarra
        working-directory: tareas
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT   # al acabar el paso (bien o mal) se para lo que haya arrancado
          # Un servidor aparte (puerto 3997), con su propio enlace de alta.
          mkdir -p /tmp/datos-pizarra
          TAREAS_DATOS=/tmp/datos-pizarra TAREAS_PUERTO=3997 node servidor/principal.js > /tmp/tablon-pizarra.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3997/tareas/salud && break; sleep 0.5; done
          CODIGO=$(grep -o '#alta=[A-Za-z0-9_-]*' /tmp/tablon-pizarra.log | head -1 | cut -d= -f2)
          if ! node pruebas/pizarra.mjs http://127.0.0.1:3997/tareas "$CODIGO" > /tmp/prueba-pizarra.log 2>&1; then
            cat /tmp/prueba-pizarra.log /tmp/tablon-pizarra.log
            tail -n 15 /tmp/prueba-pizarra.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::pizarra: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-pizarra.log

      - name: Probar el tablón
        working-directory: tareas
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT   # al acabar el paso (bien o mal) se para lo que haya arrancado
          # Un servidor aparte (puerto 3993), con su propio enlace de alta.
          mkdir -p /tmp/datos-tablon
          TAREAS_DATOS=/tmp/datos-tablon TAREAS_PUERTO=3993 node servidor/principal.js > /tmp/tablon-tablon.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3993/tareas/salud && break; sleep 0.5; done
          CODIGO=$(grep -o '#alta=[A-Za-z0-9_-]*' /tmp/tablon-tablon.log | head -1 | cut -d= -f2)
          if ! node pruebas/tablon.mjs http://127.0.0.1:3993/tareas "$CODIGO" > /tmp/prueba-tablon.log 2>&1; then
            cat /tmp/prueba-tablon.log /tmp/tablon-tablon.log
            tail -n 15 /tmp/prueba-tablon.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::tablón: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-tablon.log

      - name: Probar cumpleaños y personaje
        working-directory: tareas
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT   # al acabar el paso (bien o mal) se para lo que haya arrancado
          # Un servidor aparte (puerto 3994) con un «hoy» fijo, SOLO PARA PRUEBAS: las 23:30 en UTC del 27 de febrero
          # de 2027, que en Madrid ya es el 28 (y 2027 no es bisiesto: quien nació un 29 lo celebra ese día).
          mkdir -p /tmp/datos-cumple
          TAREAS_HOY=2027-02-27T23:30:00Z TAREAS_DATOS=/tmp/datos-cumple TAREAS_PUERTO=3994 node servidor/principal.js > /tmp/tablon-cumple.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3994/tareas/salud && break; sleep 0.5; done
          CODIGO=$(grep -o '#alta=[A-Za-z0-9_-]*' /tmp/tablon-cumple.log | head -1 | cut -d= -f2)
          if ! node pruebas/cumple.mjs http://127.0.0.1:3994/tareas "$CODIGO" > /tmp/prueba-cumple.log 2>&1; then
            cat /tmp/prueba-cumple.log /tmp/tablon-cumple.log
            tail -n 15 /tmp/prueba-cumple.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::cumple: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-cumple.log

      - name: Probar la música
        working-directory: tareas
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT   # al acabar el paso (bien o mal) se para lo que haya arrancado
          # El Spotify de mentira (puerto 8614) y un servidor aparte (3995) que habla con él, con su propio enlace de alta.
          # La prueba arranca por su cuenta otro servidor sin Spotify (3996) para ver la música «sin configurar».
          mkdir -p /tmp/datos-musica
          node pruebas/spotify-falso.mjs 8614 > /tmp/spotify-falso.log 2>&1 &
          TAREAS_DATOS=/tmp/datos-musica TAREAS_PUERTO=3995 TAREAS_URL=http://127.0.0.1:3995/tareas/ \
          SPOTIFY_CLIENT_ID=cliente-spotify SPOTIFY_CLIENT_SECRET=secreto-spotify \
          SPOTIFY_AUTH_URL=http://127.0.0.1:8614/authorize SPOTIFY_TOKEN_URL=http://127.0.0.1:8614/api/token \
          SPOTIFY_API_URL=http://127.0.0.1:8614/v1 MUSICA_INTERVALO_MS=300 \
          node servidor/principal.js > /tmp/tablon-musica.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3995/tareas/salud && break; sleep 0.5; done
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8614/control/estado > /dev/null && break; sleep 0.5; done
          CODIGO=$(grep -o '#alta=[A-Za-z0-9_-]*' /tmp/tablon-musica.log | head -1 | cut -d= -f2)
          if ! TAREAS_DATOS=/tmp/datos-musica node pruebas/musica.mjs http://127.0.0.1:3995/tareas "$CODIGO" http://127.0.0.1:8614 3996 > /tmp/prueba-musica.log 2>&1; then
            cat /tmp/prueba-musica.log /tmp/tablon-musica.log /tmp/spotify-falso.log
            tail -n 15 /tmp/prueba-musica.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::música: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-musica.log

      - name: Probar el archivo
        working-directory: tareas
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT   # al acabar el paso (bien o mal) se para lo que haya arrancado
          # Un servidor aparte (puerto 3992), con su propio enlace de alta y poco sitio (40 MB) para probar también el límite total.
          mkdir -p /tmp/datos-archivo
          TAREAS_DATOS=/tmp/datos-archivo TAREAS_PUERTO=3992 ARCHIVO_MAXIMO_MB=40 node servidor/principal.js > /tmp/tablon-archivo.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3992/tareas/salud && break; sleep 0.5; done
          CODIGO=$(grep -o '#alta=[A-Za-z0-9_-]*' /tmp/tablon-archivo.log | head -1 | cut -d= -f2)
          if ! node pruebas/archivo.mjs http://127.0.0.1:3992/tareas "$CODIGO" > /tmp/prueba-archivo.log 2>&1; then
            cat /tmp/prueba-archivo.log /tmp/tablon-archivo.log
            tail -n 15 /tmp/prueba-archivo.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::archivo: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-archivo.log

      - name: Probar el acceso de la oficina (openid-client, como WorkAdventure)
        working-directory: tareas
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT   # al acabar el paso (bien o mal) se para lo que haya arrancado
          mkdir -p /tmp/oidc && (cd /tmp/oidc && npm init -y >/dev/null && npm install --silent openid-client@5.7.1)
          node pruebas/google-falso.mjs > /tmp/google.log 2>&1 &
          mkdir -p /tmp/datos-oidc
          TAREAS_DATOS=/tmp/datos-oidc TAREAS_PUERTO=3998 TAREAS_URL=http://localhost:3998/tareas/ \
          GOOGLE_CLIENT_ID=cliente-google GOOGLE_CLIENT_SECRET=secreto-google \
          GOOGLE_AUTH_URL=http://localhost:8412/auth GOOGLE_TOKEN_URL=http://localhost:8412/token \
          OIDC_SECRETO=secreto-oficina OIDC_EMISOR=http://127.0.0.1:3998/cuentas OIDC_REDIRECCIONES=http://localhost:9999/openid-callback \
          CREW_ADMIN=admin@example.com node servidor/principal.js > /tmp/tablon-oidc.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3998/tareas/salud && break; sleep 0.5; done
          cp pruebas/oficina-oidc.mjs /tmp/oidc/
          if ! (cd /tmp/oidc && node oficina-oidc.mjs > /tmp/prueba-oidc.log 2>&1); then
            cat /tmp/prueba-oidc.log /tmp/tablon-oidc.log
            # Los errores también como anotaciones, para poder leerlos sin entrar en GitHub
            tail -n 15 /tmp/prueba-oidc.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::prueba: $linea"; done
            tail -n 10 /tmp/tablon-oidc.log | sed 's/%/%25/g' | while IFS= read -r linea; do echo "::error::servidor: $linea"; done
            exit 1
          fi
          cat /tmp/prueba-oidc.log

      - name: Preparar Docker
        uses: docker/setup-buildx-action@v3

      - name: Entrar en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: tareas
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGEN }}:${{ github.run_number }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=HOT SPOT S.L. · tablón de tareas
            org.opencontainers.image.description=Tablón de tareas de la oficina de HOT SPOT S.L.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: false
          sbom: false

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo "- \`${IMAGEN}:${{ github.run_number }}\`"
            echo "- \`${IMAGEN}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
